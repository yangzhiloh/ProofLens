name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-release-gate:
    name: Python ${{ matrix.python-version }} CPU on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install the locked development environment
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run --locked --extra dev python -m ruff check src tests scripts

      - name: Full test suite
        run: uv run --locked --extra dev python -m pytest -q

      - name: One-click artifact workflow (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\prooflens.ps1 artifacts -PythonVersion ${{ matrix.python-version }} -Output artifacts/ci-smoke

      - name: One-click artifact workflow (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/prooflens.sh artifacts ${{ matrix.python-version }} artifacts/ci-smoke

      - name: Verify published demo bundle
        run: >-
          uv run --locked --extra dev python -c
          "from pathlib import Path; root = Path('artifacts/ci-smoke/export');
          assert all((root / name).is_file() for name in
          ('model.onnx', 'calibration.json', 'artifact_manifest.json'))"

      - name: ONNX parity
        run: uv run --locked --extra dev python -m pytest -q tests/integration/test_export_parity.py

      - name: Tracked release check
        run: uv run --locked --extra dev python scripts/release_check.py --root .
