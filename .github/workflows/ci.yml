name: CI

on:
  push:
  pull_request:

jobs:
  cpu-release-gate:
    name: Python 3.11 CPU on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Full test suite
        run: python -m pytest -q

      - name: Miniature offline workflow
        run: python scripts/reproduce_small.py --output artifacts/ci-smoke --experiment e4

      - name: ONNX parity
        run: python -m pytest -q tests/integration/test_export_parity.py

      - name: Tracked release check
        run: python scripts/release_check.py --root .
