[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prooflens"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.46,<6",
  "datasets>=3,<5",
  "huggingface-hub>=0.27,<2",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<25",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "imagehash>=4.3,<5",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "safetensors>=0.5,<1",
  "gradio>=5,<7",
  "onnx>=1.17,<2",
  "onnxscript>=0.4,<1",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
openvino = ["openvino>=2026.0,<2027"]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.uv]
constraint-dependencies = [
  "numpy==2.1.3",
  "Pillow==11.0.0",
  "pydantic==2.10.3",
  "PyYAML==6.0.2",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "datasets==3.2.0",
  "huggingface-hub==0.27.1",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "scikit-learn==1.5.2",
  "ImageHash==4.3.1",
  "matplotlib==3.9.3",
  "seaborn==0.13.2",
  "safetensors==0.5.3",
  "gradio==5.8.0",
  "onnx==1.17.0",
  "onnxscript==0.4.0",
  "onnxruntime==1.20.1",
  "openvino==2026.0.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
